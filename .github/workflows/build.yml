
name: Build LitmatchAdControl

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        run: |
          make clean
          make
          mkdir -p dist
          find .theos -name 'LitmatchAdControl.dylib' -exec cp {} dist/ \;
          cp LitmatchAdControl.plist dist/
          test -s dist/LitmatchAdControl.dylib
          file dist/LitmatchAdControl.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: LitmatchAdControl-ARM64-diagnostic
          path: dist/
